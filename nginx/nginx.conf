# Balanceador: reparte las peticiones entre las dos réplicas (round-robin)
upstream api_backend {
    zone api_backend 64k;   # memoria compartida entre los workers de nginx
    server api-1:3000;
    server api-2:3000;
}

server {
    listen 80;

    # Panel de la demo (archivos estáticos servidos por nginx).
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API detrás del prefijo /api/. La barra final del proxy_pass quita el /api:
    # /api/productos/1 → http://api-x:3000/productos/1
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
