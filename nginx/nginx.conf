# Balanceador: reparte las peticiones entre las dos réplicas (round-robin)
upstream api_backend {
    zone api_backend 64k;   # memoria compartida entre los workers de nginx
    server api-1:3000;
    server api-2:3000;
}

# Las consultas de fondo del panel (estado, Redis por dentro, bandeja, registro del worker)
# usan su PROPIO round-robin. Así no le "roban" turnos a los pedidos de la demo, y los
# pedidos de productos y pagos alternan siempre api-1, api-2, api-1...
upstream api_panel {
    zone api_panel 64k;
    server api-1:3000;
    server api-2:3000;
}

server {
    listen 80;

    # Panel de la demo (archivos estáticos servidos por nginx).
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API detrás del prefijo /api/. La barra final del proxy_pass quita el /api:
    # /api/productos/1 → http://api-x:3000/productos/1
    location /api/admin/ {
        proxy_pass http://api_panel/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/emails {
        proxy_pass http://api_panel/emails;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
