# Balanceador: reparte las peticiones entre las dos réplicas (round-robin)
upstream api_backend {
    zone api_backend 64k;   # memoria compartida entre los workers de nginx
    server api-1:3000;
    server api-2:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
