# Configuración común a las dos réplicas de la API
x-api: &api
  build: ./api
  image: tp1-api
  environment: &api-env
    PORT: "3000"
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://tp1:tp1@postgres:5432/tienda
    CACHE_TTL_SECONDS: "20"   # cuánto vive una copia en la caché
    DB_DELAY_MS: "500"        # demora simulada de la base de datos
    PAGO_DELAY_MS: "1000"     # demora simulada de la pasarela de pago
    IDEMPOTENCY_TTL_SECONDS: "86400"  # cuánto se recuerda una Idempotency-Key (24 h)
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    # AOF: Redis guarda cada escritura en disco para no perder datos si se reinicia
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tp1
      POSTGRES_PASSWORD: tp1
      POSTGRES_DB: tienda
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp1 -d tienda"]
      interval: 3s
      retries: 10

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE: api-1

  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE: api-2

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # único puerto expuesto: todo entra por el balanceador
    depends_on:
      - api-1
      - api-2

volumes:
  redis-data:
  pg-data:
